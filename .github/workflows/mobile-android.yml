# 安卓 App（mobile/android）的 CI 备份：在 GitHub 的 Linux 机器上编译一个调试版 APK，确认工程能编过。
#
# 正式的安卓安装包在自己电脑上打（cd mobile && npm run android:release），用的是只存在本机的发布签名钥匙。
# 发布钥匙（.jks）和它的密码永远不要放进 GitHub（secrets 也不要）。
#
# 这里打出来的是 debug 包：用 GitHub 机器上临时生成的调试钥匙签名，和正式包的签名不同，
# 手机上装过正式包的话要先卸载才能装它，只用来临时测试。附件保留 3 天（仓库是公开的，谁都能下载）。
#
# 默认服务器地址：secrets.REEL_SERVER（推荐，日志里会打码）或 vars.REEL_SERVER（值会出现在公开日志里），都没有就留空。

name: Android App（CI 备份）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/ios/**'
      - '.github/workflows/mobile-android.yml'

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android（debug）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle*
            mobile/android/app/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 安装 Capacitor
        run: npm ci --omit=dev --no-audit --no-fund

      - name: 生成启动页配置（默认服务器地址）
        env:
          REEL_SERVER: ${{ secrets.REEL_SERVER || vars.REEL_SERVER }}
        run: node scripts/build-www.mjs

      - name: 同步到安卓工程
        run: npx cap sync android

      - name: 编译调试版 APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 整理安装包
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="reel-$VERSION-debug-$GITHUB_RUN_NUMBER.apk"
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/$NAME"
          ls -l "$RUNNER_TEMP/apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "## Reel 安卓 ${VERSION}（debug）"
            echo "- \`$NAME\`：调试钥匙签名，只用来测试；装过正式包的手机要先卸载。在本次运行的 Artifacts 里下载，保留 3 天。"
            echo "- 正式安装包在本机打：\`cd mobile && npm run android:release\`（见 mobile/README.md）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK（保留 3 天）
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ runner.temp }}/apk/${{ steps.apk.outputs.name }}
          retention-days: 3
          if-no-files-found: error
