<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 允许双指放大（看不清字的时候）；双击不放大：双击是点赞（html 上的 touch-action: manipulation，见 styles/base.css） -->
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <script>
      /*
       * 只给 iPhone / iPad（WebKit 触屏）加 maximum-scale=1：挡住「点进字号小于 16px 的输入框时整页自动放大」那一下。
       * Safari 从 iOS 10 起不会因为它禁止双指缩放，用户照样能放大；安卓 Chrome 会真的禁止缩放，所以别的设备不加。
       */
      if (/iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover')
      }
    </script>
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reel" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- warm up the (mock) image host; point these at your image CDN when connecting a real backend -->
    <link rel="preconnect" href="https://picsum.photos" />
    <link rel="preconnect" href="https://fastly.picsum.photos" />
    <title>Reel</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
